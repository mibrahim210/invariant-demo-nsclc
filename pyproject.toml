[project]
name = "invariant-demo-nsclc"
version = "0.1.0"
description = "Synthetic NSCLC-inspired paired CT/PET-like benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.0.0",
    "pytest>=7.0.0",
    "hypothesis>=6.80.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]